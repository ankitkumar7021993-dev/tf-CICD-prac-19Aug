name: Terraform CI/CD

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  terraform:
    name: Terraform CI/CD
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Login to Azure using Service Principal
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # 3. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.3

      # 4. Move to Terraform directory
      - name: Terraform Init
        working-directory: Azure_Landing_zone/Environment/Dev
        run: terraform init

      # 5. Terraform Format Check
      - name: Terraform Format
        working-directory: Azure_Landing_zone/Environment/Dev
        run: terraform fmt -check -recursive

      # 6. Terraform Validate
      - name: Terraform Validate
        working-directory: Azure_Landing_zone/Environment/Dev
        run: terraform validate

      # 7. Terraform Plan bhai ji
      - name: Terraform Plan
        working-directory: Azure_Landing_zone/Environment/Dev
        run: terraform plan -out=tfplan

      # 8. Terraform Apply
      # Only runs when code is pushed to main
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: Azure_Landing_zone/Environment/Dev
        run: terraform apply -auto-approve tfplan